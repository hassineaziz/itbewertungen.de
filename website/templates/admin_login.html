<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - {{ SITE_NAME }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 h-screen flex items-center justify-center font-sans">
    <div class="max-w-md w-full px-6">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100 text-center">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">CMS Access</h1>
            <p class="text-gray-500 mb-8">{{ SITE_NAME }}</p>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="p-3 mb-6 rounded-lg text-sm {% if category == 'error' %}bg-red-50 text-red-700{% else %}bg-green-50 text-green-700{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-6 text-left">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Admin Password</label>
                    <input type="password" name="password" required
                           class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                           placeholder="Enter CMS password">
                </div>
                <button type="submit" class="w-full bg-gray-900 text-white font-bold py-3 rounded-xl hover:bg-black transition-colors">
                    Login to CMS
                </button>
            </form>
            
            <a href="/" class="block mt-6 text-sm text-gray-500 hover:text-gray-900">&larr; Back to website</a>
        </div>
    </div>
</body>
</html>
